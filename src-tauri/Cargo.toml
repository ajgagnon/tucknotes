[package]
name = "tucknotes"
version = "0.18.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tucknotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Explicit bin name controls the dev-mode dock label on macOS,
# since `tauri dev` runs the raw binary without an .app bundle.
[[bin]]
name = "TuckNotes"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
whisper-rs = { version = "0.15", features = ["metal"] }
rubato = "0.16"
voice_activity_detector = "0.2"
rusqlite = { version = "0.34", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
llama-cpp-2 = { path = "../vendor/llama-cpp-rs/llama-cpp-2", features = ["metal"] }
llama-cpp-sys-2 = { path = "../vendor/llama-cpp-rs/llama-cpp-sys-2" }
encoding_rs = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "1.5"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
window-vibrancy = "0.5"
block2 = "0.6"
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }

